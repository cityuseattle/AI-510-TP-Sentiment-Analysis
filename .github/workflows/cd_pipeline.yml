name: CD - ML Model

on:
  push:
    branches: [main]

jobs:
  Setiment-Analysis_Deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies 
      run: pip install -r AI510-Project/model/requirements.txt
      
    - name: Train Model
      run: python AI510-Project/model/train.py

    - name: Run App and Test
      run: |
        nohup python AI510-Project/predict.py &
        sleep 5
        curl -X POST http://127.0.0.1:5000/predict \ -H "Content-Type: application/json" \ -d '{"text": "I love using this product!"}' {"cleaned_text":"i love using this product","input":"I love using this product!","sentiment":"positive"}